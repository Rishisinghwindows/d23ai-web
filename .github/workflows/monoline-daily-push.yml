name: Monoline daily push

# FREE automated daily funny message to all Monoline users (no Cloud Functions,
# no Blaze — FCM sending is free on the Spark plan).
on:
  schedule:
    - cron: "47 11 * * *"   # main run: 11:47 UTC ~= 17:17 IST — one message EVERY day
    - cron: "47 3 * * *"    # early run: 03:47 UTC ~= 09:17 IST — only sends during
                            #   the Halloween window (Oct 24-31); silent otherwise,
                            #   giving 2 spooky messages/day in-season, 1/day normally
    # --- Word Worlds evening promo, segmented to each region's ~8pm local gameplay peak.
    #     Inert until WW_PROMO_ON="1". Deep-links users into the word board.
    - cron: "30 14 * * *"   # 14:30 UTC = 20:00 IST  — India evening (hi)
    - cron: "0 19 * * *"    # 19:00 UTC = 20:00 CET  — Europe evening (de,fr,it,nl,pt,es)
    - cron: "0 1 * * *"     # 01:00 UTC = 20:00 EST  — Americas / English evening (en)
  workflow_dispatch: {}      # also lets you send on-demand from the Actions tab

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check required secret
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SA" ]; then
            echo "::error title=Missing secret::FIREBASE_SERVICE_ACCOUNT is not set."
            echo "Fix (one-time):"
            echo "  1. Firebase Console > Project settings > Service accounts > Generate new private key (downloads JSON)."
            echo "  2. GitHub repo > Settings > Secrets and variables > Actions > New repository secret."
            echo "  3. Name: FIREBASE_SERVICE_ACCOUNT   Value: paste the ENTIRE JSON file contents."
            echo "  4. Re-run this workflow (Actions tab > Run workflow)."
            exit 1
          fi
          echo "Secret present (length ${#FIREBASE_SA})."
      - name: Install deps
        working-directory: monoline-push
        run: npm install --no-audit --no-fund
      - name: Send daily push
        working-directory: monoline-push
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Which schedule triggered this run decides the message slot — robust to
          # GitHub's cron delays. "30 3 * * *" = early (slot 0), else main (slot 1).
          # A manual dispatch has no schedule → treated as the main run.
          PUSH_SLOT: ${{ github.event.schedule == '47 3 * * *' && '0' || '1' }}
          # One-time Word Worlds launch push: set to the GO-LIVE date (YYYY-MM-DD, UTC)
          # to announce the feature + deep-link users straight into it. Empty = disabled.
          WW_LAUNCH_DATE: ""
          # Word Worlds EVENING PROMO: flip to "1" to run the timezone-segmented word
          # push at each region's ~8pm local. The cron that fired picks the language group.
          WW_PROMO_ON: "1"
          WW_PROMO_LANGS: ${{ github.event.schedule == '30 14 * * *' && 'hi' || github.event.schedule == '0 19 * * *' && 'de,fr,it,nl,pt,es' || github.event.schedule == '0 1 * * *' && 'en' || '' }}
        run: node send.js
