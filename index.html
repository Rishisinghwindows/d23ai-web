<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D23 AI</title>
<meta name="description" content="D23 AI — building thoughtful software and mobile experiences.">
<style>
  :root{
    --bg:#0b0f1a; --card:#121829; --fg:#e8ecf5; --muted:#9aa6bd;
    --accent:#3ad1c6; --accent2:#4b7bec; --line:#1f2740;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f8fc; --card:#ffffff; --fg:#0e1526; --muted:#5b6478; --line:#e6ebf5; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:640px;width:100%;text-align:center}
  .logo{width:72px;height:72px;margin:0 auto 22px;border-radius:20px;
        background:linear-gradient(135deg,var(--accent),var(--accent2));
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 12px 40px rgba(59,123,236,.35)}
  .logo svg{width:38px;height:38px}
  h1{font-size:34px;margin:0 0 8px;letter-spacing:-.02em}
  p.tag{color:var(--muted);font-size:18px;margin:0 0 32px}
  .cards{display:grid;grid-template-columns:1fr;gap:14px;text-align:left}
  @media(min-width:560px){.cards{grid-template-columns:1fr 1fr}}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;
        text-decoration:none;color:inherit;transition:transform .15s ease,border-color .15s ease}
  .card:hover{transform:translateY(-2px);border-color:var(--accent)}
  .card h3{margin:0 0 4px;font-size:16px}
  .card span{color:var(--muted);font-size:14px}
  footer{margin-top:36px;color:var(--muted);font-size:13px}
  a.link{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="6" cy="18" r="2.4" fill="#fff"/>
        <circle cx="18" cy="6" r="2.4" fill="#fff"/>
        <line x1="7.6" y1="16.4" x2="16.4" y2="7.6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>D23 AI</h1>
    <p class="tag">Building thoughtful software &amp; mobile experiences.</p>

    <div class="cards">
      <a class="card" href="https://apps.apple.com/app/id6814112233">
        <h3>Monoline: One Line Puzzle →</h3>
        <span>Our one-stroke puzzle game on the App Store</span>
      </a>
      <a class="card" href="/monoline/support">
        <h3>Support →</h3>
        <span>Get help with our apps</span>
      </a>
      <a class="card" href="/monoline/privacy">
        <h3>Privacy Policy →</h3>
        <span>How we handle your data</span>
      </a>
      <a class="card" href="mailto:d23ai.in@gmail.com">
        <h3>Contact →</h3>
        <span>d23ai.in@gmail.com</span>
      </a>
    </div>

    <footer>© 2026 D23 AI · <a class="link" href="mailto:d23ai.in@gmail.com">d23ai.in@gmail.com</a></footer>
  </div>
</body>
</html>
