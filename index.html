<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>D23 AI — thoughtful software &amp; mobile games</title>
<meta name="description" content="D23 AI builds thoughtful software and delightful mobile games. Makers of Monoline, the one-line puzzle.">
<link rel="canonical" href="https://d23ai.in/">
<meta property="og:title" content="D23 AI">
<meta property="og:description" content="Thoughtful software & delightful mobile games. Makers of Monoline.">
<meta property="og:url" content="https://d23ai.in/">
<meta name="theme-color" content="#070a14">
<style>
  :root{ --bg1:#070a14; --teal:#3ad1c6; --blue:#5b8cff; --violet:#9a7cff; --fg:#eef2fb; --muted:#97a3c2; --line:rgba(255,255,255,.09); --panel:#121829; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100vh;color:var(--fg);
    background:radial-gradient(1000px 640px at 80% -10%,rgba(58,209,198,.14),transparent 58%),
               radial-gradient(900px 600px at 10% 6%,rgba(154,124,255,.16),transparent 56%),var(--bg1);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;width:100%;text-align:center}
  .logo{width:78px;height:78px;margin:0 auto 22px;border-radius:22px;
    background:linear-gradient(135deg,var(--teal),var(--blue));display:grid;place-items:center;
    box-shadow:0 16px 46px -10px rgba(91,140,255,.6)}
  .logo svg{width:40px;height:40px}
  h1{font-size:clamp(34px,7vw,52px);font-weight:850;letter-spacing:-.02em;margin-bottom:8px}
  p.tag{color:var(--muted);font-size:clamp(16px,2.6vw,19px);margin-bottom:34px;text-wrap:balance}
  .feature{display:flex;gap:16px;align-items:center;text-align:left;text-decoration:none;color:inherit;
    background:linear-gradient(180deg,var(--panel),rgba(18,24,41,.5));border:1px solid var(--line);
    border-radius:22px;padding:20px 22px;margin-bottom:16px;transition:transform .15s ease,border-color .15s ease}
  .feature:hover{transform:translateY(-2px);border-color:rgba(58,209,198,.5)}
  .feature .art{width:56px;height:56px;border-radius:16px;flex:none;display:grid;place-items:center;
    background:linear-gradient(135deg,rgba(58,209,198,.22),rgba(91,140,255,.22));border:1px solid var(--line)}
  .feature h3{font-size:18px;margin-bottom:3px}
  .feature p{color:var(--muted);font-size:14px}
  .feature .go{margin-left:auto;color:var(--teal);font-weight:800;font-size:22px;flex:none}
  .cards{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-top:6px}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
  .mini{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:16px;padding:16px;
    text-decoration:none;color:inherit;transition:border-color .15s ease}
  .mini:hover{border-color:rgba(58,209,198,.5)}
  .mini h4{font-size:15px;margin-bottom:2px}
  .mini span{color:var(--muted);font-size:13px}
  footer{margin-top:34px;color:#6b789b;font-size:13px}
  footer a{color:var(--teal);text-decoration:none}
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="18" r="2.6" fill="#fff"/><circle cx="18" cy="6" r="2.6" fill="#fff"/><line x1="7.7" y1="16.3" x2="16.3" y2="7.7" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    </div>
    <h1>D23 AI</h1>
    <p class="tag">Thoughtful software &amp; delightful mobile games.</p>

    <a class="feature" href="/monoline/">
      <span class="art" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="18" r="2.6" fill="#fff"/><circle cx="18" cy="6" r="2.6" fill="#fff"/><line x1="7.7" y1="16.3" x2="16.3" y2="7.7" stroke="#3ad1c6" stroke-width="2.4" stroke-linecap="round"/></svg>
      </span>
      <div>
        <h3>Monoline — One Line Puzzle</h3>
        <p>505 one-stroke puzzles, a charming story, offline play. Free on the App Store.</p>
      </div>
      <span class="go" aria-hidden="true">→</span>
    </a>

    <div class="cards">
      <a class="mini" href="/monoline/support/"><h4>Support</h4><span>Get help &amp; FAQ</span></a>
      <a class="mini" href="/monoline/privacy/"><h4>Privacy</h4><span>How we handle data</span></a>
      <a class="mini" href="mailto:d23ai.in@gmail.com"><h4>Contact</h4><span>d23ai.in@gmail.com</span></a>
    </div>

    <footer>© 2026 D23 AI · <a href="mailto:d23ai.in@gmail.com">d23ai.in@gmail.com</a></footer>
  </div>
</body>
</html>
